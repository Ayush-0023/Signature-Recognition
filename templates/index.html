<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signature Recognition</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #222;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .header p {
            color: #666;
            line-height: 1.5;
        }

        .model-info {
            margin-top: 15px;
            display: inline-block;
            background: #eef2ff;
            color: #4338ca;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .upload-area {
            border: 2px dashed #b8bec8;
            border-radius: 12px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-area:hover {
            border-color: #4f46e5;
            background: #fafaff;
        }

        .upload-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .upload-area h3 {
            color: #333;
            margin-bottom: 8px;
        }

        .upload-area p {
            color: #777;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .preview-container {
            display: none;
            margin-top: 25px;
            text-align: center;
        }

        .preview-container h3 {
            margin-bottom: 15px;
            color: #333;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            border: 1px solid #ddd;
            padding: 5px;
        }

        .filename {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
            word-break: break-all;
        }

        #predictButton {
            display: none;
            width: 100%;
            border: none;
            margin-top: 25px;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #predictButton:hover {
            background: #4338ca;
        }

        #predictButton:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .result h2 {
            margin-bottom: 8px;
        }

        .result p {
            font-size: 16px;
        }

        .original {
            background: #ecfdf5;
            border: 1px solid #10b981;
            color: #065f46;
        }

        .forged {
            background: #fef2f2;
            border: 1px solid #ef4444;
            color: #991b1b;
        }

        .error {
            background: #fff7ed;
            border: 1px solid #f97316;
            color: #9a3412;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- ==========================================
             Header
        =========================================== -->

        <div class="header">

            <h1>Signature Recognition</h1>

            <p>
                Upload a signature image to classify it
                as Original or Forged.
            </p>

            <div class="model-info">
                Powered by ResNet-34
            </div>

        </div>


        <!-- ==========================================
             Upload Area
        =========================================== -->

        <div
            class="upload-area"
            id="uploadArea"
        >

            <div class="upload-icon">
                ✍️
            </div>

            <h3>
                Upload Signature
            </h3>

            <p>
                Click here to select a JPG, JPEG, or PNG image
            </p>

            <input
                type="file"
                id="fileInput"
                accept=".jpg,.jpeg,.png,image/jpeg,image/png"
            >

        </div>


        <!-- ==========================================
             Image Preview
        =========================================== -->

        <div
            class="preview-container"
            id="previewContainer"
        >

            <h3>
                Selected Signature
            </h3>

            <img
                id="imagePreview"
                alt="Signature Preview"
            >

            <div
                class="filename"
                id="filename"
            ></div>

        </div>


        <!-- ==========================================
             Predict Button
        =========================================== -->

        <button id="predictButton">
            Analyze Signature
        </button>


        <!-- ==========================================
             Loading
        =========================================== -->

        <div
            class="loading"
            id="loading"
        >

            Analyzing signature...

        </div>


        <!-- ==========================================
             Result
        =========================================== -->

        <div
            class="result"
            id="result"
        >

            <h2 id="predictionText"></h2>

            <p id="confidenceText"></p>

        </div>


        <!-- ==========================================
             Footer
        =========================================== -->

        <div class="footer">
            End-to-End Signature Recognition using Deep Learning
        </div>

    </div>


    <!-- ==============================================
         JavaScript
    =============================================== -->

    <script>

        // ==========================================
        // Get HTML elements
        // ==========================================

        const uploadArea =
            document.getElementById("uploadArea");

        const fileInput =
            document.getElementById("fileInput");

        const previewContainer =
            document.getElementById("previewContainer");

        const imagePreview =
            document.getElementById("imagePreview");

        const filename =
            document.getElementById("filename");

        const predictButton =
            document.getElementById("predictButton");

        const loading =
            document.getElementById("loading");

        const result =
            document.getElementById("result");

        const predictionText =
            document.getElementById("predictionText");

        const confidenceText =
            document.getElementById("confidenceText");


        // ==========================================
        // Open file selector
        // ==========================================

        uploadArea.addEventListener(
            "click",
            function () {

                fileInput.click();

            }
        );


        // ==========================================
        // Handle selected image
        // ==========================================

        fileInput.addEventListener(
            "change",
            function () {

                const file =
                    fileInput.files[0];

                if (!file) {
                    return;
                }


                // Validate file type

                const allowedTypes = [
                    "image/jpeg",
                    "image/png"
                ];

                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    alert(
                        "Please select a JPG, JPEG, or PNG image."
                    );

                    fileInput.value = "";

                    return;
                }


                // Display image preview

                const reader =
                    new FileReader();

                reader.onload =
                    function (event) {

                        imagePreview.src =
                            event.target.result;

                        previewContainer.style.display =
                            "block";

                        predictButton.style.display =
                            "block";

                        filename.textContent =
                            file.name;

                        result.style.display =
                            "none";

                    };

                reader.readAsDataURL(
                    file
                );

            }
        );


        // ==========================================
        // Send image to FastAPI
        // ==========================================

        predictButton.addEventListener(
            "click",
            async function () {

                const file =
                    fileInput.files[0];

                if (!file) {

                    alert(
                        "Please select a signature image first."
                    );

                    return;
                }


                // ==================================
                // Create multipart form data
                // ==================================

                const formData =
                    new FormData();

                formData.append(
                    "file",
                    file
                );


                // ==================================
                // Show loading state
                // ==================================

                predictButton.disabled =
                    true;

                predictButton.textContent =
                    "Analyzing...";

                loading.style.display =
                    "block";

                result.style.display =
                    "none";


                try {

                    // ==================================
                    // POST image to FastAPI
                    // ==================================

                    const response =
                        await fetch(
                            "/predict",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    // Convert JSON response into
                    // JavaScript object

                    const data =
                        await response.json();


                    // ==================================
                    // Handle API errors
                    // ==================================

                    if (!response.ok) {

                        throw new Error(
                            data.detail ||
                            "Prediction failed."
                        );

                    }


                    // ==================================
                    // Display prediction
                    // ==================================

                    const confidencePercentage =
                        (
                            data.confidence * 100
                        ).toFixed(2);


                    predictionText.textContent =
                        `Prediction: ${data.prediction}`;

                    confidenceText.textContent =
                        `Confidence: ${confidencePercentage}%`;


                    // Remove old result classes

                    result.className =
                        "result";


                    // Add styling based on prediction

                    if (
                        data.prediction ===
                        "Original"
                    ) {

                        result.classList.add(
                            "original"
                        );

                    } else {

                        result.classList.add(
                            "forged"
                        );

                    }


                    result.style.display =
                        "block";

                }

                catch (error) {

                    result.className =
                        "result error";

                    predictionText.textContent =
                        "Prediction Error";

                    confidenceText.textContent =
                        error.message;

                    result.style.display =
                        "block";

                }

                finally {

                    loading.style.display =
                        "none";

                    predictButton.disabled =
                        false;

                    predictButton.textContent =
                        "Analyze Signature";

                }

            }
        );

    </script>

</body>

</html>
